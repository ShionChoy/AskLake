# IMDb governance policy; PolicyGovernance enforces this per-dataset configuration.
roles:
  analyst: {pii: allow}   # internal role: full access
  public:  {pii: mask}    # external role: PII masked, restricted rows hidden
pii_columns: [birthYear, deathYear]
row_filters:
  public:
    - {column: titleType, deny_values: [adult]}
row_security:                     # per-role row-level predicates (applied as view WHERE clauses)
  public:
    title_ratings: "numVotes >= 25000"
    title_basics:  "tconst IN (SELECT tconst FROM main.title_ratings WHERE numVotes >= 25000)"
    title_crew:    "tconst IN (SELECT tconst FROM main.title_ratings WHERE numVotes >= 25000)"
    title_principals: "tconst IN (SELECT tconst FROM main.title_ratings WHERE numVotes >= 25000)"
    name_basics:   "nconst IN (SELECT nconst FROM main.title_principals WHERE tconst IN (SELECT tconst FROM main.title_ratings WHERE numVotes >= 25000))"
cost_guardrail:
  require_limit: true     # reject unbounded scans (no LIMIT)
  forbid_writes: true     # reject anything but a single read-only SELECT
