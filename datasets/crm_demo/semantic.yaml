# Synthetic CRM semantic layer (Plan 2 generalization proof). Same engine as IMDb; only this
# config differs. Few-shots intentionally omitted to show grounding generalizes without them.
tables:
  - name: customers
    description: One row per customer account.
    columns:
      - {name: customer_id, description: Customer id; joins to subscriptions and support_tickets.}
      - {name: name, link: entity, description: Customer display name.}
      - {name: region, link: categorical, description: "Sales region: APAC, EMEA, AMER, LATAM."}
      - {name: signup_year, type: INTEGER, description: Year the customer signed up.}
      - {name: status, link: categorical, description: "Account status: Active or Churned."}
  - name: subscriptions
    description: One subscription per customer.
    columns:
      - {name: subscription_id, description: Subscription id.}
      - {name: customer_id, description: Customer id; joins to customers.}
      - {name: plan, link: categorical, description: "Plan tier: Basic, Pro, Enterprise."}
      - {name: monthly_fee, type: INTEGER, description: Monthly fee in USD.}
      - {name: active, description: Whether the subscription is active (boolean).}
  - name: support_tickets
    description: Support tickets raised by customers.
    columns:
      - {name: ticket_id, description: Ticket id.}
      - {name: customer_id, description: Customer id; joins to customers.}
      - {name: priority, link: categorical, description: "Ticket priority: low, medium, high."}
      - {name: resolved, description: Whether the ticket is resolved (boolean).}
  - name: regions
    description: Region reference table.
    columns:
      - {name: region, description: Region code; joins to customers.region.}
      - {name: country, description: Representative country for the region.}
synonyms:
  customer: customers
  churn: status
  churned: status
  subscription: subscriptions
  fee: monthly_fee
  ticket: support_tickets
  tickets: support_tickets
