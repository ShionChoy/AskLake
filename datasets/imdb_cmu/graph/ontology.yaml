# IMDb+CMU GraphRAG ontology (per-dataset config; the extraction engine reads this, hardcodes
# nothing). Triples are extracted from CMU plot summaries; films join back to IMDb via the
# entity-alignment crosswalk in the dataset connector (see docs/dataset.md).
entity_types: [Film, Person, Theme, Character, Place, Genre, Language, Country, Year, Actor]
relation_types: [HAS_THEME, DIRECTED_BY, FEATURES_CHARACTER, SET_IN, HAS_GENRE, IN_LANGUAGE, FROM_COUNTRY, RELEASED_IN, PLAYED_BY, ACTED_IN]
attribute_relations: [HAS_GENRE, IN_LANGUAGE, FROM_COUNTRY, RELEASED_IN, HAS_THEME]
hint: >
  Use the film's title as the subject for film-level facts. Emit DIRECTED_BY -> director
  (a person), HAS_THEME -> a short theme phrase (e.g. "memory", "identity", "time"),
  FEATURES_CHARACTER -> a named character, and SET_IN -> a place or era. Prefer concise,
  reusable theme labels so films sharing a theme connect in the graph.
empty_graph_hint: >
  No matching facts found in the knowledge graph. This graph is built from the CMU plot-summary
  corpus (roughly pre-2013), so newer titles — and films without a plot summary — may be absent.
  Try naming a specific older film by its exact title, or use the SQL/data view for facts like
  ratings, year, runtime, and cast counts.
