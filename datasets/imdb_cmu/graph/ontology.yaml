# IMDb-native GraphRAG ontology (per-dataset config; the extraction engine reads this, hardcodes
# nothing). Structured triples (genre/year/director/cast/character) come from the IMDb parquet;
# theme triples are LLM-extracted from current English Wikipedia plot text (fetched via a
# Wikidata P345 ID bridge).
entity_types: [Film, Person, Theme, Character, Place, Genre, Year, Actor]
relation_types: [HAS_THEME, DIRECTED_BY, FEATURES_CHARACTER, SET_IN, HAS_GENRE, RELEASED_IN, PLAYED_BY, ACTED_IN]
attribute_relations: [HAS_GENRE, RELEASED_IN]
connective_relations: [HAS_THEME]
entity_relations: [DIRECTED_BY, ACTED_IN, FEATURES_CHARACTER, PLAYED_BY, SET_IN]
intents:
  - {name: cast,       shape: entity_lookup, triggers: [actor, actors, cast, starred, starring, star, stars, plays, played, acted, acting, appears, appearing, role, roles], target_relations: [ACTED_IN, PLAYED_BY, FEATURES_CHARACTER]}
  - {name: director,   shape: entity_lookup, triggers: [director, directors, directed, directs, filmmaker, made], target_relations: [DIRECTED_BY]}
  - {name: themes,     shape: cluster,       triggers: [theme, themes, motif, motifs, about, plot, story, message, meaning], target_relations: [HAS_THEME]}
  - {name: connection, shape: pairwise,      triggers: [related, connection, connected, common, between, share, shared, link, links, similar, both], target_relations: [HAS_THEME, DIRECTED_BY, ACTED_IN]}
hint: >
  Use the film's title as the subject for film-level facts. Emit DIRECTED_BY -> director
  (a person), HAS_THEME -> a short theme phrase (e.g. "memory", "identity", "time"),
  FEATURES_CHARACTER -> a named character, and SET_IN -> a place or era. Prefer concise,
  reusable theme labels so films sharing a theme connect in the graph.
empty_graph_hint: >
  No matching facts found in the knowledge graph. The graph covers popular IMDb films
  (numVotes >= 1000); theme data is LLM-extracted from current English Wikipedia plot summaries
  and may be absent for some titles. Try the film's exact IMDb title, or use the SQL/data view
  for facts like ratings, year, runtime, and cast.
